<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1150" viewBox="0 0 1800 1150" role="img" aria-labelledby="title desc">
  <title id="title">Repertoire implementation roadmap</title>
  <desc id="desc">Dependency-ordered roadmap from the existing Neovim distribution and DDMC Phase 1 kernel through a safe read-only worker MVP, productization tracks, and Repertoire 1.0.</desc>
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop stop-color="#172554"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
    <style>text{font-family:Inter,Helvetica,Arial,sans-serif}.h{font-weight:700}.lane{font-size:14px;font-weight:700}.body{font-size:11.5px;fill:#475569}.edge{fill:none;stroke-width:2}.box{stroke-width:2}.dash{stroke-dasharray:7 6}</style>
  </defs>
  <rect width="1800" height="1150" fill="#fff"/><rect x="20" y="20" width="1760" height="100" rx="12" fill="url(#head)"/><text x="50" y="61" font-size="25" fill="#fff" class="h">REPERTOIRE  |  IMPLEMENTATION ROADMAP</text><text x="50" y="91" font-size="15" fill="#cbd5e1">Dependency-ordered capability increments · no calendar promises · every diamond is an executable exit gate</text>
  <rect x="20" y="140" width="1760" height="150" rx="10" fill="#ecfdf5" stroke="#86efac"/><text x="38" y="164" class="lane" fill="#166534">CURRENT / VERIFIED FOUNDATION</text>
  <rect x="20" y="310" width="1760" height="255" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="38" y="334" class="lane" fill="#1e3a8a">NEXT / THREE PARALLEL TRACKS</text>
  <rect x="20" y="585" width="1760" height="190" rx="10" fill="#f0fdfa" stroke="#5eead4"/><text x="38" y="609" class="lane" fill="#134e4a">SAFE MVP / TRACKS CONVERGE</text>
  <rect x="20" y="795" width="1760" height="190" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/><text x="38" y="819" class="lane" fill="#5b21b6">LATER / PRODUCTIZATION TRACKS</text>

  <g><rect x="155" y="185" width="260" height="80" rx="10" fill="#fff" stroke="#16a34a" class="box"/><text x="285" y="209" text-anchor="middle" class="h" font-size="13" fill="#166534">R0  ISOLATED NEOVIM DISTRO</text><text x="285" y="232" text-anchor="middle" class="body"><tspan x="285">install · UI · pinned plugins</tspan><tspan x="285" dy="18">headless / installed-runtime checks</tspan></text></g>
  <g><rect x="595" y="185" width="300" height="80" rx="10" fill="#fff" stroke="#16a34a" class="box"/><text x="745" y="209" text-anchor="middle" class="h" font-size="13" fill="#166534">R1  HARNESS CONTRACT</text><text x="745" y="232" text-anchor="middle" class="body"><tspan x="745">boundaries · state model · isolation</tspan><tspan x="745" dy="18">DESIGN ONLY — runtime not implemented</tspan></text></g>
  <g><rect x="1095" y="185" width="330" height="80" rx="10" fill="#fff" stroke="#16a34a" class="box"/><text x="1260" y="209" text-anchor="middle" class="h" font-size="13" fill="#166534">D1  DDMC PHASES 0–1  |  EXTERNAL</text><text x="1260" y="232" text-anchor="middle" class="body"><tspan x="1260">identity · versioned contracts · generic kernel</tspan><tspan x="1260" dy="18">consumer pin + compatibility check pending</tspan></text></g>

  <g><rect x="105" y="365" width="285" height="85" rx="10" fill="#fff" stroke="#2563eb" class="box"/><text x="248" y="389" text-anchor="middle" class="h" font-size="13" fill="#1e40af">N1  REPERTOIRE ↔ DDMC BINDING ADR</text><text x="248" y="411" text-anchor="middle" class="body"><tspan x="248">Script / Production / Scene mapping</tspan><tspan x="248" dy="18">patch + evidence + outcome fixtures</tspan></text></g>
  <g><rect x="105" y="465" width="285" height="75" rx="10" fill="#fff" stroke="#2563eb" class="box"/><text x="248" y="489" text-anchor="middle" class="h" font-size="13" fill="#1e40af">N2  PURE WORKFLOW KERNEL</text><text x="248" y="512" text-anchor="middle" class="body">plan validator · transitions · fail-closed records</text></g>
  <g><path d="M483 437L535 482L483 527L430 482Z" fill="#dbeafe" stroke="#2563eb" class="box"/><text x="483" y="479" text-anchor="middle" class="h" font-size="12" fill="#1e40af"><tspan x="483">G1</tspan><tspan x="483" dy="15">KERNEL</tspan></text></g>
  <g><rect x="595" y="365" width="300" height="85" rx="10" fill="#fff" stroke="#2563eb" class="box"/><text x="745" y="389" text-anchor="middle" class="h" font-size="13" fill="#1e40af">N3  MAINTAINED FORK + PROVENANCE</text><text x="745" y="411" text-anchor="middle" class="body"><tspan x="745">MIT attribution · source lock · immutable pin</tspan><tspan x="745" dy="18">retire competing patch source</tspan></text></g>
  <g><rect x="595" y="465" width="300" height="75" rx="10" fill="#fff" stroke="#2563eb" class="box"/><text x="745" y="489" text-anchor="middle" class="h" font-size="13" fill="#1e40af">N4–N5  ACP BRIDGE + CONFORMANCE</text><text x="745" y="512" text-anchor="middle" class="body">create(cwd) · prompt · events · cancel · fake + real probes</text></g>
  <g><path d="M985 432L1040 482L985 532L930 482Z" fill="#dbeafe" stroke="#2563eb" class="box"/><text x="985" y="470" text-anchor="middle" class="h" font-size="11" fill="#1e40af"><tspan x="985">G2</tspan><tspan x="985" dy="14">PORTABLE</tspan><tspan x="985" dy="14">SESSIONS</tspan></text></g>
  <g><rect x="1100" y="365" width="315" height="85" rx="10" fill="#fff" stroke="#2563eb" class="box"/><text x="1258" y="389" text-anchor="middle" class="h" font-size="13" fill="#1e40af">N6  LOCAL RUST COMPOSITION ROOT</text><text x="1258" y="411" text-anchor="middle" class="body"><tspan x="1258">pinned DDMC core/contracts · versioned IPC</tspan><tspan x="1258" dy="18">runtime ports; no durability claim yet</tspan></text></g>
  <g><rect x="1100" y="465" width="315" height="75" rx="10" fill="#fff" stroke="#2563eb" class="box"/><text x="1258" y="489" text-anchor="middle" class="h" font-size="13" fill="#1e40af">N7  LOCAL DURABILITY PORTS</text><text x="1258" y="512" text-anchor="middle" class="body">SQLite · local CAS · restart · digest conformance</text></g>
  <g><path d="M1513 432L1570 482L1513 532L1455 482Z" fill="#dbeafe" stroke="#2563eb" class="box"/><text x="1513" y="470" text-anchor="middle" class="h" font-size="11" fill="#1e40af"><tspan x="1513">G3</tspan><tspan x="1513" dy="14">LOCAL</tspan><tspan x="1513" dy="14">DURABILITY</tspan></text></g>

  <g><rect x="80" y="640" width="225" height="70" rx="10" fill="#fff" stroke="#0f766e" class="box"/><text x="193" y="664" text-anchor="middle" class="h" font-size="12" fill="#134e4a">M1  IMMUTABLE BASELINE</text><text x="193" y="687" text-anchor="middle" class="body">dirty state · modes · links · identity</text></g>
  <g><rect x="365" y="630" width="245" height="90" rx="10" fill="#fff" stroke="#0f766e" class="box"/><text x="488" y="655" text-anchor="middle" class="h" font-size="12" fill="#134e4a">M2–M3  READ-ONLY WORKERS</text><text x="488" y="677" text-anchor="middle" class="body"><tspan x="488">isolated stages · dependency waves</tspan><tspan x="488" dy="18">explicit cwd · structured returns</tspan></text></g>
  <g><rect x="670" y="630" width="245" height="90" rx="10" fill="#fff" stroke="#0f766e" class="box"/><text x="793" y="655" text-anchor="middle" class="h" font-size="12" fill="#134e4a">M4–M6  COLLECT + INTEGRATE</text><text x="793" y="677" text-anchor="middle" class="body"><tspan x="793">immutable artifacts · drift pause</tspan><tspan x="793" dy="18">sole canonical writer</tspan></text></g>
  <g><rect x="975" y="630" width="245" height="90" rx="10" fill="#fff" stroke="#0f766e" class="box"/><text x="1098" y="655" text-anchor="middle" class="h" font-size="12" fill="#134e4a">M7  REVIEW + VERIFY</text><text x="1098" y="677" text-anchor="middle" class="body"><tspan x="1098">fresh adversarial review</tspan><tspan x="1098" dy="18">repository-wide deterministic checks</tspan></text></g>
  <g><path d="M1350 625L1410 675L1350 725L1290 675Z" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/><text x="1350" y="672" text-anchor="middle" class="h" font-size="12" fill="#134e4a"><tspan x="1350">G4</tspan><tspan x="1350" dy="15">SAFE MVP</tspan></text></g>
  <g><rect x="1470" y="635" width="260" height="80" rx="10" fill="#fff" stroke="#0f766e"/><text x="1600" y="659" text-anchor="middle" class="h" font-size="12" fill="#134e4a">EXIT</text><text x="1600" y="680" text-anchor="middle" class="body"><tspan x="1600">worker cannot mutate canonical;</tspan><tspan x="1600" dy="17">only reviewed + verified output is accepted</tspan></text></g>

  <g><rect x="65" y="850" width="245" height="70" rx="10" fill="#fff" stroke="#7c3aed" class="box"/><text x="188" y="874" text-anchor="middle" class="h" font-size="12" fill="#5b21b6">L1  PRIVATE WRITABLE STAGES</text><text x="188" y="897" text-anchor="middle" class="body">exact-baseline patches · conflict safety</text></g>
  <g><rect x="345" y="850" width="245" height="70" rx="10" fill="#fff" stroke="#7c3aed" class="box"/><text x="468" y="874" text-anchor="middle" class="h" font-size="12" fill="#5b21b6">L2  CANONICAL SCRIPTS</text><text x="468" y="897" text-anchor="middle" class="body">TDD · specialist review · Git workflows</text></g>
  <g><rect x="625" y="850" width="245" height="70" rx="10" fill="#fff" stroke="#7c3aed" class="box"/><text x="748" y="874" text-anchor="middle" class="h" font-size="12" fill="#5b21b6">L3  DURABLE PRODUCT UX</text><text x="748" y="897" text-anchor="middle" class="body">resume / cancel · dashboard · history</text></g>
  <g><rect x="905" y="850" width="245" height="70" rx="10" fill="#fff" stroke="#7c3aed" class="box"/><text x="1028" y="874" text-anchor="middle" class="h" font-size="12" fill="#5b21b6">L4  GITHUB DELIVERY</text><text x="1028" y="897" text-anchor="middle" class="body">PR / CI / merge / release policy gates</text></g>
  <g><rect x="1185" y="842" width="245" height="86" rx="10" fill="#fff" stroke="#7c3aed" class="box"/><text x="1308" y="867" text-anchor="middle" class="h" font-size="12" fill="#5b21b6">L5  HARDENING</text><text x="1308" y="889" text-anchor="middle" class="body"><tspan x="1308">portability · security · failure injection</tspan><tspan x="1308" dy="18">upgrade / rollback / migration</tspan></text></g>
  <g><path d="M1563 835L1625 885L1563 935L1500 885Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="1563" y="872" text-anchor="middle" class="h" font-size="12" fill="#4c1d95"><tspan x="1563">G5</tspan><tspan x="1563" dy="14">REPERTOIRE</tspan><tspan x="1563" dy="14">1.0</tspan></text></g>

