  <path d="M285 265V300H745V365M745 265V365M745 450V465M895 502H930" class="edge" stroke="#2563eb" marker-end="url(#ab)"/>
  <path d="M1260 265V365M390 408H1100M1258 450V465M1415 502H1455" class="edge" stroke="#2563eb" marker-end="url(#ab)"/>
  <path d="M483 527V580H193V640M985 532V580H193V640" class="edge" stroke="#0f766e" marker-end="url(#at)"/><path d="M305 675H365M610 675H670M915 675H975M1220 675H1290M1410 675H1470" class="edge" stroke="#0f766e" marker-end="url(#at)"/>
  <path d="M1513 532V570H793V630" class="edge dash" stroke="#2563eb" marker-end="url(#ab)"/><text x="1120" y="566" font-size="10" fill="#1e40af">durable resume joins collection/integration</text>
  <path d="M1350 725V790H188V850M1350 725V790H468V850M1513 532V790H748V850M1350 725V790H1028V850M1350 725V790H1308V842" class="edge" stroke="#7c3aed" marker-end="url(#ap)"/>
