  <rect x="70" y="1010" width="1660" height="55" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="7 6"/><text x="90" y="1043" font-size="13" fill="#475569">OPTIONAL / NON-CORRECTNESS PATH  |  provider-native subagents behind explicit capability + user setting · remote/cloud DDMC adapters · third-party scripts/domain packs · additional SCM/CI providers</text>
  <path d="M1563 935V1010" class="edge dash" stroke="#94a3b8"/>
  <rect x="70" y="1080" width="1660" height="40" rx="8" fill="#1e293b"/><text x="90" y="1105" font-size="12" fill="#e2e8f0">OPEN DECISIONS BEFORE N1/N6  |  Rust sidecar supersedes prior Lua state-machine ownership · IPC + supervision · DDMC semantic mapping · local repository transaction boundary · snapshot/secret policy · exact integration authority</text>
</svg>
