<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Repertoire solution architecture</title>
  <desc id="desc">Local-first agentic development harness with a Neovim client, Rust control plane, embedded DDMC governance kernel, isolated worker stages, canonical Git workspace, provider sessions, and GitHub delivery.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1"><stop stop-color="#172554"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc2626"/></marker>
    <style>
      text{font-family:Inter,Helvetica,Arial,sans-serif}.h{font-weight:700}.small{font-size:13px}.body{font-size:14px;fill:#475569}.title{font-size:25px;fill:white;font-weight:700}.subtitle{font-size:15px;fill:#cbd5e1}.box{stroke-width:2}.edge{fill:none;stroke-width:2}.dash{stroke-dasharray:7 6}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#ffffff"/>
  <rect x="20" y="20" width="1560" height="100" rx="12" fill="url(#header)"/>
  <text x="50" y="61" class="title">REPERTOIRE  |  SOLUTION ARCHITECTURE</text>
  <text x="50" y="91" class="subtitle">Local-first agentic development harness · Neovim UX · Rust control plane · DDMC-governed acceptance</text>

  <path d="M250 208H315" class="edge" stroke="#f97316" marker-end="url(#arrow-gray)"/>
  <path d="M745 198H805" class="edge" stroke="#7c3aed" marker-end="url(#arrow-purple)"/><text x="775" y="190" text-anchor="middle" font-size="10" fill="#5b21b6">commands</text>
  <path d="M805 218H745" class="edge dash" stroke="#7c3aed" marker-end="url(#arrow-purple)"/><text x="775" y="232" text-anchor="middle" font-size="10" fill="#5b21b6">events</text>
  <path d="M1225 208H1285" class="edge dash" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path d="M530 270V320H400V355" class="edge" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <path d="M420 355V335H570V270" class="edge dash" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <path d="M515 398H545" class="edge" stroke="#2563eb" marker-end="url(#arrow-blue)"/><path d="M545 418H515" class="edge dash" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <path d="M775 408H805M1035 408H1065" class="edge" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <path d="M660 460V500M1170 460V480H1060V500" class="edge" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
  <path d="M560 615V650H555M780 635V615M1140 635V460" class="edge" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <path d="M660 460V620H420V635" class="edge" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <path d="M1140 705V740H190V785" class="edge" stroke="#dc2626" marker-end="url(#arrow-red)"/>
  <path d="M1140 705V740H690V770" class="edge" stroke="#0f766e" marker-end="url(#arrow-gray)"/>
  <path d="M1140 705V750H1190V785" class="edge dash" stroke="#475569" marker-end="url(#arrow-gray)"/><text x="1200" y="753" font-size="11" fill="#475569">authorized command</text>

  <g><rect x="40" y="155" width="210" height="105" rx="12" fill="#fff7ed" stroke="#f97316" class="box"/><text x="145" y="185" text-anchor="middle" class="h" font-size="15" fill="#7c2d12">HUMAN AUTHORITY</text><text x="145" y="211" text-anchor="middle" class="body"><tspan x="145">intent · constraints</tspan><tspan x="145" dy="21">approvals · exceptions</tspan></text></g>
  <g><rect x="315" y="145" width="430" height="125" rx="12" fill="#eef2ff" stroke="#4f46e5" class="box"/><text x="530" y="178" text-anchor="middle" class="h" font-size="16" fill="#312e81">REPERTOIRE / NEOVIM CLIENT</text><text x="530" y="206" text-anchor="middle" class="body"><tspan x="530">commands · recipe editor · run dashboard</tspan><tspan x="530" dy="22">diff / evidence / review views</tspan></text></g>
  <g><rect x="805" y="145" width="420" height="125" rx="12" fill="#f5f3ff" stroke="#8b5cf6" class="box"/><text x="1015" y="178" text-anchor="middle" class="h" font-size="15" fill="#5b21b6">ACP SESSION BRIDGE</text><text x="1015" y="205" text-anchor="middle" class="body"><tspan x="1015">provider-neutral create / prompt / cancel / events</tspan><tspan x="1015" dy="22">explicit working directory + capability probe</tspan></text></g>
  <g><rect x="1285" y="155" width="270" height="105" rx="12" fill="#f8fafc" stroke="#64748b" class="box dash"/><text x="1420" y="185" text-anchor="middle" class="h" font-size="15" fill="#334155">MODEL PROVIDERS</text><text x="1420" y="211" text-anchor="middle" class="body"><tspan x="1420">Codex · Claude · others</tspan><tspan x="1420" dy="21">provider auth stays external</tspan></text></g>

  <rect x="250" y="305" width="1060" height="420" rx="14" fill="#f8fafc" stroke="#2563eb" class="box"/>
  <text x="275" y="335" class="h" font-size="15" fill="#1e3a8a">LOCAL TRUST BOUNDARY  |  REPERTOIRE RUST CONTROL PLANE (proposed)</text>
  <g><rect x="285" y="355" width="230" height="105" rx="10" fill="#eff6ff" stroke="#60a5fa"/><text x="400" y="382" text-anchor="middle" class="h" font-size="14" fill="#1e40af">LOCAL API / EVENT STREAM</text><text x="400" y="407" text-anchor="middle" class="small body"><tspan x="400">versioned IPC · commands · status</tspan><tspan x="400" dy="20">no credentials in persisted events</tspan></text></g>
  <g><rect x="545" y="355" width="230" height="105" rx="10" fill="#eff6ff" stroke="#2563eb" class="box"/><text x="660" y="382" text-anchor="middle" class="h" font-size="14" fill="#1e40af">PLAN + RUNTIME</text><text x="660" y="407" text-anchor="middle" class="small body"><tspan x="660">MECE validator · state machine</tspan><tspan x="660" dy="20">DAG scheduler · leases · recovery</tspan></text></g>
  <g><rect x="805" y="355" width="230" height="105" rx="10" fill="#f0fdfa" stroke="#14b8a6" class="box"/><text x="920" y="382" text-anchor="middle" class="h" font-size="14" fill="#115e59">WORKSPACE CONTROLLER</text><text x="920" y="407" text-anchor="middle" class="small body"><tspan x="920">frozen baseline · private stages</tspan><tspan x="920" dy="20">drift detection · single writer</tspan></text></g>
  <g><rect x="1065" y="355" width="210" height="105" rx="10" fill="#ecfdf5" stroke="#22c55e" class="box"/><text x="1170" y="382" text-anchor="middle" class="h" font-size="14" fill="#166534">QUALITY ORCHESTRATION</text><text x="1170" y="407" text-anchor="middle" class="small body"><tspan x="1170">TDD gates · evidence collectors</tspan><tspan x="1170" dy="20">review + verification policies</tspan></text></g>
  <g><rect x="395" y="500" width="770" height="115" rx="12" fill="#f5f3ff" stroke="#7c3aed" class="box"/><text x="415" y="528" class="h" font-size="15" fill="#4c1d95">DDMC GOVERNED-RESOLUTION KERNEL  |  EMBEDDED RUST LIBRARIES</text><text x="415" y="551" class="small body"><tspan x="415">ddmc-core + ddmc-contracts (available) · stable identity + versioned records</tspan><tspan x="415" dy="20">candidate + evidence → independent policy decision → authoritative outcome</tspan><tspan x="415" dy="20">Authorship never establishes authority; unsupported contract versions fail closed.</tspan></text></g>
  <g><rect x="285" y="635" width="270" height="70" rx="9" fill="#fff" stroke="#64748b"/><text x="420" y="657" text-anchor="middle" class="h small" fill="#334155">LOCAL REPOSITORIES</text><text x="420" y="677" text-anchor="middle" class="small body"><tspan x="420">SQLite workflow + DDMC product state</tspan><tspan x="420" dy="17">artifacts · provenance</tspan></text></g>
  <g><rect x="645" y="635" width="270" height="70" rx="9" fill="#fff" stroke="#64748b"/><text x="780" y="657" text-anchor="middle" class="h small" fill="#334155">VERSIONED REPERTOIRE</text><text x="780" y="676" text-anchor="middle" class="small body"><tspan x="780">recipes · role contracts · policies</tspan><tspan x="780" dy="17">verification profiles</tspan></text></g>
  <g><rect x="1005" y="635" width="270" height="70" rx="9" fill="#fff" stroke="#64748b"/><text x="1140" y="657" text-anchor="middle" class="h small" fill="#334155">GIT + DELIVERY ADAPTER</text><text x="1140" y="676" text-anchor="middle" class="small body"><tspan x="1140">status · snapshot · worktree · diff</tspan><tspan x="1140" dy="17">commit / push / PR only under policy</tspan></text></g>

  <g><rect x="40" y="785" width="300" height="110" rx="12" fill="#fef2f2" stroke="#dc2626" class="box"/><text x="190" y="817" text-anchor="middle" class="h" font-size="14" fill="#991b1b">CANONICAL WORKSPACE</text><text x="190" y="844" text-anchor="middle" class="small body"><tspan x="190">user-owned dirty state preserved</tspan><tspan x="190" dy="21">integration session is sole writer</tspan></text></g>
  <g><rect x="410" y="770" width="560" height="140" rx="12" fill="#f0fdfa" stroke="#0f766e" class="box"/><text x="690" y="803" text-anchor="middle" class="h" font-size="15" fill="#134e4a">ISOLATED WORKER STAGES</text><text x="690" y="832" text-anchor="middle" class="body"><tspan x="690">frozen baseline → read-only MVP → private writable worktrees</tspan><tspan x="690" dy="23">exclusive path ownership · structured patch + evidence return</tspan><tspan x="690" dy="23">workers never write the canonical checkout</tspan></text></g>
  <g><rect x="1040" y="785" width="300" height="110" rx="12" fill="#f8fafc" stroke="#475569" class="box dash"/><text x="1190" y="817" text-anchor="middle" class="h" font-size="14" fill="#1e293b">GITHUB / CI / RELEASE</text><text x="1190" y="844" text-anchor="middle" class="small body"><tspan x="1190">fork · protected branch · PR checks</tspan><tspan x="1190" dy="21">merge + release remain policy-gated</tspan></text></g>
  <rect x="40" y="940" width="1515" height="40" rx="8" fill="#1e293b"/><text x="60" y="965" font-size="13" fill="#e2e8f0">BOUNDARIES  Solid = local / enforced   ·   Dashed = external / replaceable   ·   Red = canonical write boundary   ·   Purple = DDMC authority semantics</text>
</svg>
