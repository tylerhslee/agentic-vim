<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Repertoire end-to-end DevOps workflow</title>
  <desc id="desc">Governed delivery workflow from human intent through capability planning, isolated TDD workers, single-writer integration, independent review, deterministic verification, GitHub CI, merge, and release.</desc>
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop stop-color="#172554"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc2626"/></marker>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
    <style>text{font-family:Inter,Helvetica,Arial,sans-serif}.h{font-weight:700}.body{font-size:12px;fill:#475569}.lane{font-size:14px;font-weight:700}.edge{fill:none;stroke-width:2}.dash{stroke-dasharray:7 6}.box{stroke-width:2}.label{font-size:11px;font-weight:700}</style>
  </defs>
  <rect width="1800" height="1200" fill="#fff"/><rect x="20" y="20" width="1760" height="100" rx="12" fill="url(#head)"/>
  <text x="50" y="61" font-size="25" fill="#fff" class="h">REPERTOIRE  |  END-TO-END DEVOPS WORKFLOW</text><text x="50" y="91" font-size="15" fill="#cbd5e1">Every actor proposes · evidence is independent · policy decides · only an accepted exact revision becomes authoritative</text>
  <rect x="20" y="140" width="1760" height="125" fill="#fff7ed" stroke="#fdba74"/><text x="38" y="164" fill="#9a3412" class="lane">HUMAN AUTHORITY</text>
  <rect x="20" y="280" width="1760" height="190" fill="#eff6ff" stroke="#93c5fd"/><text x="38" y="304" fill="#1e3a8a" class="lane">REPERTOIRE / CONTRACT + PREFLIGHT</text>
  <rect x="20" y="485" width="1760" height="300" fill="#f0fdfa" stroke="#5eead4"/><text x="38" y="509" fill="#134e4a" class="lane">ISOLATED EXECUTION / INTEGRATION / LOCAL ACCEPTANCE</text>
  <rect x="20" y="800" width="1760" height="180" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="7 6"/><text x="38" y="824" fill="#334155" class="lane">AUTHORIZED EXTERNAL DELIVERY / GITHUB + CI + RELEASE</text>

  <g><rect x="190" y="165" width="230" height="75" rx="10" fill="#fff" stroke="#f97316" class="box"/><text x="305" y="189" text-anchor="middle" class="h" font-size="13" fill="#7c2d12">1  INTENT + SCOPE</text><text x="305" y="210" text-anchor="middle" class="body"><tspan x="305">request · constraints · acceptance</tspan><tspan x="305" dy="18">delivery scope: local / PR / merge / release</tspan></text></g>
  <g><rect x="790" y="165" width="240" height="75" rx="10" fill="#fff" stroke="#f97316" class="box"/><text x="910" y="189" text-anchor="middle" class="h" font-size="13" fill="#7c2d12">AUTHORITY GATES</text><text x="910" y="210" text-anchor="middle" class="body"><tspan x="910">dispatch · external writes</tspan><tspan x="910" dy="18">merge · release · exceptions</tspan></text></g>
  <g><rect x="1370" y="165" width="250" height="75" rx="10" fill="#fff" stroke="#f97316" class="box"/><text x="1495" y="186" text-anchor="middle" class="h" font-size="13" fill="#7c2d12">SCOPE-AWARE OUTCOME</text><text x="1495" y="207" text-anchor="middle" class="body"><tspan x="1495">completed-local · PR · merged · released</tspan><tspan x="1495" dy="17">observations propose a new run</tspan></text></g>

  <g><rect x="165" y="330" width="230" height="90" rx="10" fill="#fff" stroke="#2563eb" class="box"/><text x="280" y="354" text-anchor="middle" class="h" font-size="13" fill="#1e40af">2  INSPECT + PIN</text><text x="280" y="376" text-anchor="middle" class="body"><tspan x="280">instructions · repository state</tspan><tspan x="280" dy="18">recipe / policy / provider versions</tspan></text></g>
  <g><rect x="475" y="330" width="230" height="90" rx="10" fill="#fff" stroke="#2563eb" class="box"/><text x="590" y="354" text-anchor="middle" class="h" font-size="13" fill="#1e40af">3  PLAN CANDIDATE</text><text x="590" y="376" text-anchor="middle" class="body"><tspan x="590">MECE capabilities · DAG · ownership</tspan><tspan x="590" dy="18">interfaces · seams · objective checks</tspan></text></g>
  <g><path d="M852 322L915 375L852 428L790 375Z" fill="#fef3c7" stroke="#d97706" class="box"/><text x="852" y="371" text-anchor="middle" class="h" font-size="12" fill="#92400e"><tspan x="852">VALID +</tspan><tspan x="852" dy="16">COMPLETE?</tspan></text></g>
  <g><rect x="790" y="435" width="300" height="28" rx="8" fill="#fff" stroke="#7c3aed" class="box"/><text x="940" y="453" text-anchor="middle" class="h" font-size="10.5" fill="#5b21b6">INDEPENDENT PLAN REVIEW · read-only · coverage / duplication / seams / risk</text></g>
  <g><rect x="1005" y="330" width="260" height="90" rx="10" fill="#fff" stroke="#2563eb" class="box"/><text x="1135" y="354" text-anchor="middle" class="h" font-size="13" fill="#1e40af">4  PORTABLE CAPABILITY GATE</text><text x="1135" y="376" text-anchor="middle" class="body"><tspan x="1135">sessions · cwd · normalized events</tspan><tspan x="1135" dy="18">cancellation · enforced filesystem isolation</tspan></text></g>
  <g><rect x="1350" y="330" width="250" height="90" rx="10" fill="#fff" stroke="#0f766e" class="box"/><text x="1475" y="354" text-anchor="middle" class="h" font-size="13" fill="#115e59">5  FREEZE BASELINE</text><text x="1475" y="376" text-anchor="middle" class="body"><tspan x="1475">tracked + relevant dirty / untracked</tspan><tspan x="1475" dy="18">modes · links · policy · stable identity</tspan></text></g>

  <g><rect x="105" y="540" width="220" height="88" rx="10" fill="#fff" stroke="#0f766e" class="box"/><text x="215" y="564" text-anchor="middle" class="h" font-size="13" fill="#134e4a">6  DISPATCH WAVES</text><text x="215" y="586" text-anchor="middle" class="body"><tspan x="215">dependency-ready scenes</tspan><tspan x="215" dy="18">disjoint scopes · bounded roles</tspan></text></g>
  <g><rect x="390" y="525" width="250" height="118" rx="10" fill="#fff" stroke="#0f766e" class="box"/><text x="515" y="550" text-anchor="middle" class="h" font-size="13" fill="#134e4a">7  WORKER TDD LOOP</text><text x="515" y="573" text-anchor="middle" class="body"><tspan x="515">RED observed → minimal GREEN</tspan><tspan x="515" dy="18">refactor while green → regression</tspan><tspan x="515" dy="18">immutable patch + evidence</tspan></text></g>
  <g><rect x="710" y="540" width="220" height="88" rx="10" fill="#fff" stroke="#0f766e" class="box"/><text x="820" y="564" text-anchor="middle" class="h" font-size="13" fill="#134e4a">8  COLLECT</text><text x="820" y="586" text-anchor="middle" class="body"><tspan x="820">provenance · scope · baseline</tspan><tspan x="820" dy="18">dependency completeness</tspan></text></g>
  <g><path d="M1055 530L1115 584L1055 638L995 584Z" fill="#fee2e2" stroke="#dc2626" class="box"/><text x="1055" y="580" text-anchor="middle" class="h" font-size="12" fill="#991b1b"><tspan x="1055">CANONICAL</tspan><tspan x="1055" dy="16">DRIFT?</tspan></text></g>
  <g><rect x="1190" y="540" width="250" height="88" rx="10" fill="#fff" stroke="#dc2626" class="box"/><text x="1315" y="564" text-anchor="middle" class="h" font-size="13" fill="#991b1b">9  SINGLE-WRITER INTEGRATION</text><text x="1315" y="586" text-anchor="middle" class="body"><tspan x="1315">apply incrementally · reconcile seams</tspan><tspan x="1315" dy="18">produce exact integrated candidate</tspan></text></g>
  <g><rect x="1495" y="540" width="240" height="88" rx="10" fill="#fff" stroke="#7c3aed" class="box"/><text x="1615" y="564" text-anchor="middle" class="h" font-size="13" fill="#5b21b6">10  FRESH ADVERSARIAL REVIEW</text><text x="1615" y="586" text-anchor="middle" class="body"><tspan x="1615">severity · file/line · failure mode</tspan><tspan x="1615" dy="18">evidence · smallest fix</tspan></text></g>
  <g><rect x="1100" y="675" width="280" height="82" rx="10" fill="#fff" stroke="#22c55e" class="box"/><text x="1240" y="699" text-anchor="middle" class="h" font-size="13" fill="#166534">11  DETERMINISTIC VERIFICATION</text><text x="1240" y="721" text-anchor="middle" class="body"><tspan x="1240">focused → regression → integration / E2E</tspan><tspan x="1240" dy="18">diff · secrets · pins · portability · docs</tspan></text></g>
  <g><path d="M1518 666L1580 716L1518 766L1455 716Z" fill="#dcfce7" stroke="#16a34a" class="box"/><text x="1518" y="712" text-anchor="middle" class="h" font-size="12" fill="#166534"><tspan x="1518">LOCAL GATES</tspan><tspan x="1518" dy="16">PASS?</tspan></text></g>
  <g><rect x="585" y="681" width="285" height="68" rx="9" fill="#fef2f2" stroke="#ef4444"/><text x="728" y="704" text-anchor="middle" class="h" font-size="12" fill="#991b1b">NEW ATTEMPT / REPAIR PLAN</text><text x="728" y="725" text-anchor="middle" class="body">candidate only after successful completion</text></g>
  <g><path d="M58 540L95 584L58 628L20 584Z" fill="#fff7ed" stroke="#f97316" class="box"/><text x="58" y="588" text-anchor="middle" class="h" font-size="10" fill="#9a3412">AUTH?</text></g>

  <g><rect x="135" y="850" width="210" height="75" rx="10" fill="#ecfdf5" stroke="#16a34a" class="box"/><text x="240" y="875" text-anchor="middle" class="h" font-size="12" fill="#166534">12  LOCAL AUTHORITATIVE OUTCOME</text><text x="240" y="898" text-anchor="middle" class="body">delivery-ready ≠ published</text></g>
  <g><rect x="455" y="850" width="210" height="75" rx="10" fill="#fff" stroke="#475569" class="box"/><text x="560" y="875" text-anchor="middle" class="h" font-size="13" fill="#1e293b">13  PUSH + PR</text><text x="560" y="898" text-anchor="middle" class="body">exact commit · contract · evidence · risks</text></g>
  <g><path d="M400 850L440 887L400 925L360 887Z" fill="#fff7ed" stroke="#f97316" class="box"/><text x="400" y="891" text-anchor="middle" class="h" font-size="10" fill="#9a3412">AUTH?</text></g>
  <g><rect x="770" y="850" width="230" height="75" rx="10" fill="#fff" stroke="#475569" class="box"/><text x="885" y="875" text-anchor="middle" class="h" font-size="13" fill="#1e293b">14  REQUIRED CI + REVIEW</text><text x="885" y="898" text-anchor="middle" class="body">observations; exact commit stays current</text></g>
  <g><rect x="1110" y="850" width="245" height="75" rx="10" fill="#fff" stroke="#475569" class="box"/><text x="1233" y="875" text-anchor="middle" class="h" font-size="13" fill="#1e293b">15  MERGE / RELEASE GATES</text><text x="1233" y="898" text-anchor="middle" class="body">protect · reproduce · sign · publish · deploy · smoke</text></g>
  <g><path d="M1055 850L1095 887L1055 925L1015 887Z" fill="#fff7ed" stroke="#f97316" class="box"/><text x="1055" y="891" text-anchor="middle" class="h" font-size="10" fill="#9a3412">AUTH?</text></g>
  <g><path d="M1405 850L1445 887L1405 925L1365 887Z" fill="#fef3c7" stroke="#d97706" class="box"/><text x="1405" y="891" text-anchor="middle" class="h" font-size="10" fill="#92400e">PASS?</text></g>
  <g><rect x="1250" y="935" width="310" height="50" rx="8" fill="#fef2f2" stroke="#dc2626"/><text x="1405" y="955" text-anchor="middle" class="h" font-size="10" fill="#991b1b">RETRY / ROLLBACK VERIFICATION</text><text x="1405" y="973" text-anchor="middle" font-size="10" fill="#991b1b">record evidence, then renew authority</text></g>
  <g><rect x="1460" y="842" width="250" height="90" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/><text x="1585" y="869" text-anchor="middle" class="h" font-size="12" fill="#4c1d95">16  EXTERNAL AUTHORITATIVE OUTCOME</text><text x="1585" y="892" text-anchor="middle" class="body"><tspan x="1585">exact SHA / tag / artifact digests</tspan><tspan x="1585" dy="18">actor + policy + evidence retained</tspan></text></g>

  <path d="M305 240V285H280V330M420 202H790" class="edge" stroke="#f97316" marker-end="url(#a-gray)"/><path d="M395 375H475M705 375H790" class="edge" stroke="#2563eb" marker-end="url(#a-blue)"/><path d="M852 428V435" class="edge" stroke="#7c3aed" marker-end="url(#a-purple)"/><path d="M1090 449H1135V420M1265 375H1350" class="edge" stroke="#2563eb" marker-end="url(#a-blue)"/>
  <path d="M790 449H720V420H590" class="edge" stroke="#dc2626" marker-end="url(#a-red)"/><text x="625" y="435" class="label" fill="#991b1b">review rejects → replan</text>
  <path d="M852 428V452H590V420" class="edge" stroke="#dc2626" marker-end="url(#a-red)"/><text x="690" y="448" class="label" fill="#991b1b">invalid / incomplete</text>
  <path d="M1475 420V490H58V540M95 584H105" class="edge" stroke="#0f766e" marker-end="url(#a-teal)"/><path d="M325 584H390M640 584H710M930 584H995M1115 584H1190" class="edge" stroke="#0f766e" marker-end="url(#a-teal)"/><path d="M1440 584H1495" class="edge" stroke="#7c3aed" marker-end="url(#a-purple)"/>
  <path d="M1615 628V655H1240V675M1380 716H1455" class="edge" stroke="#16a34a" marker-end="url(#a-teal)"/>
  <path d="M1055 530V280H910V240" class="edge" stroke="#dc2626" marker-end="url(#a-red)"/><text x="1065" y="300" class="label" fill="#991b1b">drift → pause; never auto-stash/reset</text>
  <path d="M910 240V300H1475V330" class="edge" stroke="#f97316" marker-end="url(#a-gray)"/><text x="1160" y="294" class="label" fill="#9a3412">approved rebaseline / resume</text>
  <path d="M790 202H80V520H58V540M910 240V820H400V850M1030 202H1055V850" class="edge dash" stroke="#f97316" marker-end="url(#a-gray)"/>
  <path d="M58 628V1100M400 925V990H55V1124H70M1055 925V990H1740V1124H1730" class="edge dash" stroke="#dc2626" marker-end="url(#a-red)"/><text x="75" y="1088" class="label" fill="#991b1b">authority denied / expired → pause or cancel</text>
  <path d="M1455 716H870" class="edge" stroke="#dc2626" marker-end="url(#a-red)"/><path d="M585 715H515V643" class="edge" stroke="#dc2626" marker-end="url(#a-red)"/><text x="980" y="707" class="label" fill="#991b1b">review reject / check fail</text>
  <path d="M1518 766V815H240V850" class="edge" stroke="#16a34a" marker-end="url(#a-teal)"/><path d="M345 887H360M440 887H455M665 887H770M1000 887H1015M1095 887H1110M1355 887H1365M1445 887H1460" class="edge dash" stroke="#475569" marker-end="url(#a-gray)"/><text x="350" y="838" class="label" fill="#475569">request external delivery → validate authority token</text>
  <path d="M135 887H60V135H1330V202H1370" class="edge" stroke="#f97316" marker-end="url(#a-gray)"/><text x="66" y="825" class="label" fill="#9a3412" transform="rotate(-90 66 825)">local scope ends</text>
  <path d="M885 925V958H728V749" class="edge dash" stroke="#dc2626" marker-end="url(#a-red)"/><text x="742" y="955" class="label" fill="#991b1b">CI fail / changes requested / stale base → local repair</text>
  <path d="M1405 925V935M1250 960H1055V925" class="edge" stroke="#dc2626" marker-end="url(#a-red)"/><text x="1105" y="953" class="label" fill="#991b1b">new attempt; renew grant</text>
  <path d="M1585 842V270H1495V240" class="edge" stroke="#7c3aed" marker-end="url(#a-purple)"/>
  <rect x="70" y="1005" width="1660" height="80" rx="10" fill="#f5f3ff" stroke="#8b5cf6" class="box"/><text x="90" y="1033" class="h" font-size="14" fill="#4c1d95">DDMC AUTHORITY RAIL</text><text x="90" y="1057" font-size="13" fill="#4c1d95">Operation → Attempt → SuccessfulCompletion → Candidate + immutable Evidence → Decision [reject / escalate / accept] → AuthoritativeOutcome</text><text x="90" y="1077" font-size="12" fill="#475569">Failed/cancelled attempts retain history but create no candidate. Test, CI, reviewer, provider, and Git IDs are evidence metadata—not product identity or authority.</text>
  <rect x="70" y="1100" width="1660" height="48" rx="8" fill="#1e293b"/><text x="90" y="1129" font-size="12" fill="#e2e8f0">CONTROL RAIL  |  PAUSE: persist + recheck authority/capabilities/drift on resume · CANCEL: stop new work + request cancellation + await terminal settlement · FAIL: typed reason + last safe phase + recovery</text>
</svg>
